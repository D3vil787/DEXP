name: Build launcher APK

on:
  push:
    branches: [main]
    paths: ['launcher/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Signing key from secrets
        env:
          KS_B64: ${{ secrets.DEXP_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::Secrets DEXP_KEYSTORE_B64 / DEXP_KEYSTORE_PASSWORD are not set. Without them every build gets a random key and cannot be installed over the previous one."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dexp.keystore"
          echo "DEXP_KEYSTORE_FILE=$RUNNER_TEMP/dexp.keystore" >> "$GITHUB_ENV"

      - name: Build
        working-directory: launcher
        env:
          DEXP_KEYSTORE_PASSWORD: ${{ secrets.DEXP_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dexp-home-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "apk" branch
        run: |
          cp launcher/app/build/outputs/apk/debug/app-debug.apk /tmp/dexp-home.apk
          cd /tmp && rm -rf apkbranch && mkdir apkbranch && cd apkbranch
          git init -q -b apk
          cp /tmp/dexp-home.apk .
          echo "Built from ${GITHUB_SHA} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > BUILD.txt
          git add dexp-home.apk BUILD.txt
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
