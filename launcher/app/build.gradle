plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anton.dexphome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anton.dexphome'
        // The DEXP F49B8000K runs Android 4.2.1 (API 17).
        minSdk 17
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK installs without extra setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
