plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anton.dexphome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anton.dexphome'
        // The DEXP F49B8000K runs Android 4.2.1 (API 17).
        minSdk 17
        targetSdk 34
        versionCode 11
        versionName '2.1'
    }

    // One permanent key, so every new build installs over the previous one.
    // CI passes it via repository secrets; local builds fall back to the debug key.
    def ksFile = System.getenv('DEXP_KEYSTORE_FILE')
    signingConfigs {
        stable {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('DEXP_KEYSTORE_PASSWORD')
                keyAlias 'dexp'
                keyPassword System.getenv('DEXP_KEYSTORE_PASSWORD')
                v1SigningEnabled true   // Android 4.2 only understands v1 (JAR) signatures
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            if (ksFile) signingConfig signingConfigs.stable
        }
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.stable : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
